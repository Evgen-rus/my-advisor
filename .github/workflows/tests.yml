name: Installer tests

on: [push]

permissions:
  contents: read

jobs:
  installer:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python -m unittest discover -s tests -v
